name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Build release package
        run: swift build -c release
      - name: Run tests
        run: swift test --parallel
      - name: Smoke-test CLI
        run: swift run receipt-parser Tests/JapaneseReceiptParserTests/Fixtures/receipt_ja.txt
